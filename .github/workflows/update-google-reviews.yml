name: Atualizar avaliações do Google

on:
  # Agendamento automático desativado: a Google Places API exige faturamento
  # ativado no projeto do Google Cloud, o que a Saffir decidiu não usar (o
  # Google pediu pré-pagamento de R$150 para liberar). Avaliações agora são
  # atualizadas manualmente em src/data/google-reviews.json.
  # Para reativar no futuro: descomentar o bloco `schedule` abaixo.
  # schedule:
  #   - cron: '0 7 * * *' # 04:00 (horário de Brasília), todo dia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar avaliações na Google Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Commitar mudanças, se houver
        run: |
          if git diff --quiet -- src/data/google-reviews.json; then
            echo "Sem mudanças nas avaliações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/google-reviews.json
          git commit -m "chore: atualiza avaliações do Google"
          git push
